<!DOCTYPE html>
<html lang="en">

<head>
  <!--
    Theme initialization — runs synchronously before CSS is applied to prevent
    flash of incorrect theme (FOUC). Sets data-theme on <html> from localStorage
    or prefers-color-scheme before the first paint.
  -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wb-theme');
        var resolved = (t === 'dark' || t === 'light') ? t
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- ── Default title + description (overridden per-page by react-helmet-async) ── -->

    content="GSP-licensed compliance platform with software and APIs for GST, e-invoicing, e-way bills, and accounting. Trusted by P&G, IBM, Razorpay, and 12,000+ businesses across India." />

  <!-- ── SEO base signals ────────────────────────────────────────────────────── -->

  <meta name="author" content="Whitebooks" />

    content="GST software India, e-invoice software, e-way bill software, accounting software India, GSP GSTN, GST Suvidha Provider, KSA e-invoicing ZATCA" />

  <meta property="og:title" content="Whitebooks — Compliance Infrastructure for India and KSA" />

    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <!-- ── Structured data: Organization + WebSite (always present) ─────────────
       Page-level schemas are injected per-route via react-helmet-async.
  ──────────────────────────────────────────────────────────────────────────── -->
  <script type="application/ld+json">
  {

          "url": "https://whitebooks.in/og-image.png",
          "width": 200,
          "height": 48
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91 90321 11788",

        "@type": "WebSite",
        "@id": "https://whitebooks.in/#website",
        "url": "https://whitebooks.in",
        "name": "Whitebooks",
        "description": "Whitebooks — Compliance Infrastructure for India and KSA",

        "potentialAction": {

    ]
  }
  </script>
</head>
